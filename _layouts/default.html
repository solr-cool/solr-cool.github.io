<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% if page.title %}{{ site.title }} — {{ page.title | strip_html }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
{% if page.description or site.description %}<meta name="description" content="{{ page.description | default: site.description | strip_html }}" />{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body>

{% include site-header.html %}

{{ content }}

{% include site-footer.html %}

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
