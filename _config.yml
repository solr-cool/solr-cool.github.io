title: solr.cool
tagline: Field notes on open-source search
description: Field notes on open-source search — Apache Solr, hybrid retrieval with RRF, semantic vectors, RAG pipelines and agentic retrieval stacks. Practical assessments for teams running production search.
url: https://solr.cool

email: hello@solr.cool

logo: /assets/favicon.svg

social:
  name: Torsten Bøgh Köster
  links:
    - https://github.com/tboeghk
    - https://twitter.com/tboeghk

twitter:
  username: tboeghk
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at

defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /assets/social-card.png
      author: tboeghk
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/social-card.png

markdown: kramdown
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - target
  - test
  - vendor
  - .bundle
  - .gk
